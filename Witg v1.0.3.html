<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Chemistry Sandbox - Particle Separation Fixed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #00ffff;
      text-align: center;
      pointer-events: none;
    }
  </style>
  <!-- MediaPipe Tasks Vision CDN -->
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    let handLandmarker;
    let video;
    let canvas, ctx;
    let lastVideoTime = -1;

    let particles = [];
    let effects = [];
    let showSidebar = false;
    let sidebarPage = 1;
    let showHelp = true;
    let lastSpawnTime = {};

    const RECIPE_TARGETS = [
      { target: 'H2O', label: '물 (H2O)' },
      { target: 'Fe_Oxide', label: '산화철 (Fe_Oxide)' },
      { target: 'PhPh_Pink', label: '붉은색 페놀프탈레인' },
      { target: 'CO2', label: '이산화탄소 (CO2)' },
      { target: 'Pb_Shielded', label: '차폐된 납' },
      { target: 'Ash', label: '산화마그네슘/재 (Ash)' },
      { target: 'Cu_Oxide', label: '산화구리 (Cu_Oxide)' },
      { target: 'H2', label: '수소 기체 (H2)' },
      { target: 'O2', label: '산소 기체 (O2)' },
      { target: 'Salt', label: '염/소금 (Salt)' },
      { target: 'Acid', label: '산성 물질 (Acid)' },
      { target: 'Base', label: '염기성 물질 (Base)' },
      { target: 'Fe', label: '환원된 철 (Fe)' },
      { target: 'Cu', label: '치환된 구리 (Cu)' },
      { target: 'Al_Salt', label: '알루민산염' },
      { target: 'Mg_Salt', label: '마그네슘 염' },
      { target: 'Fe_Salt', label: '철 염' },
      { target: 'Cu_Salt', label: '구리 염' }
    ];

    let challengeState = {
      active: false,
      currentTarget: null,
      timeLeft: 35,
      status: 'IDLE',
      lastTick: 0
    };

    const row1_info = [
      { type: 'H2O', label: '+ 물', color: 'rgb(40, 160, 240)' },
      { type: 'Acid', label: '+ 산성', color: 'rgb(100, 255, 50)' },
      { type: 'Base', label: '+ 염기성', color: 'rgb(150, 50, 200)' },
      { type: 'PhPh', label: '+ 페놀프탈레인', color: 'rgb(220, 220, 220)' },
      { type: 'NaHCO3', label: '+ 베이킹소다', color: 'rgb(230, 240, 250)' },
      { type: 'H2O2', label: '+ 과산화수소', color: 'rgb(200, 240, 255)' },
      { type: 'Fire', label: '+ 불', color: 'rgb(255, 60, 30)' },
      { type: 'TOGGLE_BOOK', label: '[📖 도감]', color: 'rgb(50, 180, 200)' },
      { type: 'TOGGLE_CHALLENGE', label: '[🎯 랜덤 챌린지]', color: 'rgb(255, 180, 0)' }
    ];

    const row2_info = [
      { type: 'Na', label: '+ 나트륨', color: 'rgb(255, 210, 50)' },
      { type: 'K', label: '+ 칼륨', color: 'rgb(220, 100, 220)' },
      { type: 'Mg', label: '+ 마그네슘', color: 'rgb(200, 200, 200)' },
      { type: 'Al', label: '+ 알루미늄', color: 'rgb(180, 190, 200)' },
      { type: 'Fe', label: '+ 철', color: 'rgb(100, 90, 80)' },
      { type: 'Cu', label: '+ 구리', color: 'rgb(200, 110, 50)' },
      { type: 'U', label: '+ 우라늄', color: 'rgb(50, 255, 50)' },
      { type: 'Pb', label: '+ 납', color: 'rgb(120, 100, 100)' },
      { type: 'RESET', label: '[🧹 리셋]', color: 'rgb(200, 50, 50)' }
    ];

    const btnW = 122, btnH = 42, gapX = 12, startX = 40;
    const buttons = [];

    row1_info.forEach((info, idx) => {
      const x1 = startX + idx * (btnW + gapX);
      buttons.push({ x1, y1: 10, x2: x1 + btnW, y2: 10 + btnH, ...info });
    });

    row2_info.forEach((info, idx) => {
      const x1 = startX + idx * (btnW + gapX);
      buttons.push({ x1, y1: 60, x2: x1 + btnW, y2: 60 + btnH, ...info });
    });

    const PROPS = {
      'H2O':        { color: 'rgb(40, 160, 240)', label: '물' },
      'Acid':       { color: 'rgb(100, 255, 50)', label: '산성' },
      'Base':       { color: 'rgb(150, 50, 200)', label: '염기성' },
      'PhPh':       { color: 'rgb(230, 230, 230)', label: '페놀프탈레인' },
      'PhPh_Pink':  { color: 'rgb(255, 50, 180)', label: '페놀프탈레인(붉은색)' },
      'NaHCO3':     { color: 'rgb(250, 240, 230)', label: '베이킹소다' },
      'H2O2':       { color: 'rgb(200, 240, 255)', label: '과산화수소' },
      'Fire':       { color: 'rgb(255, 60, 30)',   label: '불' },
      'H2':         { color: 'rgb(180, 240, 240)', label: '수소 기체' },
      'O2':         { color: 'rgb(255, 200, 100)', label: '산소 기체' },
      'CO2':        { color: 'rgb(180, 150, 150)', label: '이산화탄소' },
      'Na':         { color: 'rgb(255, 210, 50)',  label: '나트륨' },
      'K':          { color: 'rgb(220, 100, 220)', label: '칼륨' },
      'Mg':         { color: 'rgb(200, 200, 200)', label: '마그네슘' },
      'Al':         { color: 'rgb(180, 190, 200)', label: '알루미늄' },
      'Fe':         { color: 'rgb(100, 90, 80)',   label: '철' },
      'Cu':         { color: 'rgb(200, 110, 50)',  label: '구리' },
      'U':          { color: 'rgb(50, 255, 50)',   label: '우라늄(U)' },
      'Pb':         { color: 'rgb(120, 100, 100)', label: '납(Pb)' },
      'Salt':       { color: 'rgb(240, 220, 180)', label: '염(소금)' },
      'Al_Salt':    { color: 'rgb(230, 210, 210)', label: '알루민산염' },
      'Mg_Salt':    { color: 'rgb(200, 220, 200)', label: '마그네슘 염' },
      'Fe_Salt':    { color: 'rgb(110, 140, 100)', label: '철 염' },
      'Cu_Salt':    { color: 'rgb(100, 150, 50)',  label: '구리 염' },
      'Fe_Oxide':   { color: 'rgb(160, 70, 40)',   label: '산화철' },
      'Ash':        { color: 'rgb(230, 230, 230)', label: '산화마그네슘(재)' },
      'Cu_Oxide':   { color: 'rgb(60, 50, 50)',    label: '산화구리' },
      'Pb_Shielded':{ color: 'rgb(120, 150, 120)', label: '차폐된 납' }
    };

    class SparkParticle {
      constructor(x, y, color, speedMult = 1.0, sizeMult = 1.0) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 10 + 2) * speedMult;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = Math.floor(Math.random() * 20) + 15;
        this.maxLife = this.life;
        this.color = color;
        this.sizeMult = sizeMult;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.life--;
      }
      draw(ctx) {
        if (this.life > 0) {
          const alpha = this.life / this.maxLife;
          const radius = Math.max(1, (4 * alpha) * this.sizeMult);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    class ChemicalParticle {
      constructor(x, y, elemType) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 26;
        this.elemType = elemType;
        this.isGrabbed = false;
        this.grabbedBy = null;
        this.prevX = x;
        this.prevY = y;
        this.setupProperties();
      }
      setupProperties() {
        const prop = PROPS[this.elemType] || { color: 'rgb(200, 200, 200)', label: this.elemType };
        this.color = prop.color;
        this.label = prop.label;
      }
      update(width, height, effectsList, gravity = 0.6) {
        if (this.elemType === 'U' && Math.random() < 0.20) {
          effectsList.push(new SparkParticle(this.x, this.y, 'rgb(50, 255, 50)', 0.6, 1.2));
        }

        if (this.isGrabbed) {
          this.vx = (this.x - this.prevX) * 0.8;
          this.vy = (this.y - this.prevY) * 0.8;
          this.prevX = this.x;
          this.prevY = this.y;
        } else {
          if (['H2', 'O2', 'CO2'].includes(this.elemType)) {
            this.vy -= 0.35;
          } else {
            this.vy += gravity;
          }

          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.98;

          if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -0.7;
          } else if (this.x + this.radius > width) {
            this.x = width - this.radius;
            this.vx *= -0.7;
          }

          if (this.y + this.radius > height - 15) {
            this.y = height - 15 - this.radius;
            this.vy *= -0.5;
            this.vx *= 0.9;
          } else if (this.y - this.radius < 115) {
            this.y = 115 + this.radius;
            this.vy *= -0.3;
          }
        }
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (this.elemType === 'U') {
          ctx.strokeStyle = '#00ff00';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (this.isGrabbed) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 6, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.label, this.x, this.y);
        ctx.restore();
      }
    }

    // 💡 생성된 입자들이 바로 부딪히지 않도록 안전한 간격(65px 이상)과 좌우 반발 속도 부여
    function createSplitParticles(types, cx, cy) {
      const count = types.length;
      const spacing = 68; // 충돌 기준(52px)보다 넉넉한 간격
      const startX = cx - ((count - 1) * spacing) / 2;

      return types.map((type, idx) => {
        const p = new ChemicalParticle(startX + idx * spacing, cy, type);
        p.vx = (idx - (count - 1) / 2) * 3.5; // 양옆으로 펼쳐지는 분산 속도
        return p;
      });
    }

    function startRandomChallenge() {
      const randomIdx = Math.floor(Math.random() * RECIPE_TARGETS.length);
      challengeState.currentTarget = RECIPE_TARGETS[randomIdx];
      challengeState.active = true;
      challengeState.timeLeft = 35;
      challengeState.status = 'RUNNING';
      challengeState.lastTick = performance.now();
      particles = [];
      effects = [];
    }

    async function init() {
      const loadingEl = document.getElementById('loading');
      video = document.getElementById('webcam');
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });

      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
      video.srcObject = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });

      loadingEl.style.display = 'none';
      setupEventListeners();
      requestAnimationFrame(renderLoop);
    }

    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());
        updateGame(results);
      }
      drawGame();
      requestAnimationFrame(renderLoop);
    }

    function updateGame(results) {
      const handPinchStates = {};

      if (results.landmarks) {
        results.landmarks.forEach((landmarks, handIdx) => {
          const handLabel = `Hand_${handIdx}`;
          const tx = (1 - landmarks[4].x) * canvas.width;
          const ty = landmarks[4].y * canvas.height;
          const ix = (1 - landmarks[8].x) * canvas.width;
          const iy = landmarks[8].y * canvas.height;

          const pinchX = Math.floor((tx + ix) / 2);
          const pinchY = Math.floor((ty + iy) / 2);
          const dist = Math.hypot(tx - ix, ty - iy);

          const currentlyHolding = particles.some(p => p.isGrabbed && p.grabbedBy === handLabel);
          const pinchThreshold = currentlyHolding ? 85 : 50;
          const isPinched = dist < pinchThreshold;

          handPinchStates[handLabel] = { tx, ty, ix, iy, pinchX, pinchY, isPinched };
        });
      }

      if (challengeState.active && challengeState.status === 'RUNNING') {
        const now = performance.now();
        if (now - challengeState.lastTick >= 1000) {
          challengeState.timeLeft--;
          challengeState.lastTick = now;
          if (challengeState.timeLeft <= 0) {
            challengeState.timeLeft = 0;
            challengeState.status = 'FAILED';
          }
        }

        if (challengeState.currentTarget && particles.some(p => p.elemType === challengeState.currentTarget.target)) {
          challengeState.status = 'SUCCESS';
          for (let i = 0; i < 80; i++) {
            effects.push(new SparkParticle(canvas.width / 2, canvas.height / 2, 'rgb(255, 215, 0)', 3.0, 2.5));
          }
        }
      }

      particles.forEach(p => {
        if (p.isGrabbed) {
          const hState = handPinchStates[p.grabbedBy];
          if (hState && hState.isPinched) {
            p.x = hState.pinchX;
            p.y = hState.pinchY;
          } else {
            p.isGrabbed = false;
            p.grabbedBy = null;
          }
        }
      });

      const currTime = performance.now() / 1000;
      Object.entries(handPinchStates).forEach(([handLabel, hState]) => {
        if (hState.isPinched) {
          const isHolding = particles.some(p => p.isGrabbed && p.grabbedBy === handLabel);
          if (!isHolding) {
            const lastT = lastSpawnTime[handLabel] || 0;
            if (currTime - lastT > 0.35) {
              for (const btn of buttons) {
                if (hState.pinchX >= btn.x1 && hState.pinchX <= btn.x2 &&
                    hState.pinchY >= (btn.y1 - 10) && hState.pinchY <= (btn.y2 + 25)) {
                  if (btn.type === 'TOGGLE_BOOK') {
                    showSidebar = !showSidebar;
                  } else if (btn.type === 'TOGGLE_CHALLENGE') {
                    startRandomChallenge();
                  } else if (btn.type === 'RESET') {
                    particles = [];
                    effects = [];
                    if (challengeState.active) startRandomChallenge();
                  } else {
                    const newP = new ChemicalParticle(hState.pinchX, hState.pinchY + 45, btn.type);
                    newP.isGrabbed = true;
                    newP.grabbedBy = handLabel;
                    particles.push(newP);
                  }
                  lastSpawnTime[handLabel] = currTime;
                  break;
                }
              }
            }
          }
        }
      });

      Object.entries(handPinchStates).forEach(([handLabel, hState]) => {
        if (hState.isPinched) {
          const isHolding = particles.some(p => p.isGrabbed && p.grabbedBy === handLabel);
          if (!isHolding) {
            for (const p of particles) {
              if (!p.isGrabbed) {
                if (Math.hypot(p.x - hState.pinchX, p.y - hState.pinchY) < (p.radius + 50)) {
                  p.isGrabbed = true;
                  p.grabbedBy = handLabel;
                  p.x = hState.pinchX;
                  p.y = hState.pinchY;
                  break;
                }
              }
            }
          }
        }
      });

      // 4. 화학 반응 처리 (모든 멀티 생성을 createSplitParticles로 안전하게 격리)
      const toRemove = new Set();
      const newParticles = [];

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i];
          const p2 = particles[j];
          const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

          if (dist < (p1.radius + p2.radius)) {
            const types = [p1.elemType, p2.elemType].sort().join(',');
            const cx = (p1.x + p2.x) / 2;
            const cy = (p1.y + p2.y) / 2;
            const isMatch = (t1, t2) => types === [t1, t2].sort().join(',');

            if (isMatch('O2', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Fire', 'Fire'], cx, cy));
              for (let k = 0; k < 60; k++) effects.push(new SparkParticle(cx, cy, 'rgb(30, 100, 255)', 2.2));
            } else if (isMatch('H2', 'O2')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'H2O'));
              for (let k = 0; k < 90; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 180, 255)', 2.8, 2.0));
            } else if (isMatch('H2', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'H2O'));
              for (let k = 0; k < 45; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 150, 255)', 1.6));
            } else if (isMatch('O2', 'Mg') || isMatch('Mg', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Ash'));
              for (let k = 0; k < 75; k++) effects.push(new SparkParticle(cx, cy, 'rgb(255, 255, 255)', 2.5, 2.2));
            } else if (isMatch('Fe', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Fe_Oxide'));
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(30, 100, 255)', 1.0));
            } else if (isMatch('NaHCO3', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              // ✨ CO2와 H2O가 서로 떨어져 튀어나오도록 수정 완료
              newParticles.push(...createSplitParticles(['CO2', 'H2O'], cx, cy));
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(230, 240, 255)', 1.0));
            } else if (isMatch('Fire', 'H2O') || isMatch('Fire', 'CO2')) {
              toRemove.add(i); toRemove.add(j);
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(180, 180, 180)', 0.7));
            } else if (isMatch('Mg', 'CO2')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Ash'));
              for (let k = 0; k < 60; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 200, 250)', 1.8));
            } else if (isMatch('O2', 'Fe')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Fe_Oxide'));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(40, 70, 160)', 0.8));
            } else if (isMatch('O2', 'Cu')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Cu_Oxide'));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 50, 60)', 0.8));
            } else if (isMatch('Fe_Oxide', 'Al')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Fe'));
              for (let k = 0; k < 70; k++) effects.push(new SparkParticle(cx, cy, 'rgb(30, 140, 255)', 2.2, 1.8));
            } else if (isMatch('Fe_Oxide', 'H2')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Fe', 'H2O'], cx, cy));
              for (let k = 0; k < 35; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 220, 255)', 1.1));
            } else if (isMatch('Fe', 'Cu_Oxide')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Cu', 'Fe_Salt'], cx, cy));
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 180, 200)', 0.9));
            } else if (isMatch('Al', 'Cu_Oxide')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Cu', 'Al_Salt'], cx, cy));
              for (let k = 0; k < 35; k++) effects.push(new SparkParticle(cx, cy, 'rgb(180, 200, 220)', 1.0));
            } else if (isMatch('Na', 'Acid') || isMatch('K', 'Acid')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2', 'Salt'], cx, cy));
              for (let k = 0; k < 70; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 220, 255)', 2.4));
            } else if (isMatch('Acid', 'Base')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2O', 'Salt'], cx, cy));
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(220, 220, 220)', 0.8));
            } else if (isMatch('NaHCO3', 'Acid')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['CO2', 'H2O', 'Salt'], cx, cy));
              for (let k = 0; k < 60; k++) effects.push(new SparkParticle(cx, cy, 'rgb(230, 240, 255)', 1.8));
            } else if (isMatch('CO2', 'H2O')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Acid'));
              for (let k = 0; k < 20; k++) effects.push(new SparkParticle(cx, cy, 'rgb(100, 255, 150)', 0.6));
            } else if (isMatch('CO2', 'Base')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Salt', 'H2O'], cx, cy));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 100, 200)', 0.8));
            } else if (isMatch('Acid', 'Fe_Oxide')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Fe_Salt', 'H2O'], cx, cy));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(100, 200, 150)', 0.8));
            } else if (isMatch('Acid', 'Cu_Oxide')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Cu_Salt', 'H2O'], cx, cy));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 200, 180)', 0.8));
            } else if (isMatch('Acid', 'Ash')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Mg_Salt', 'H2O'], cx, cy));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 220, 200)', 0.8));
            } else if (isMatch('Base', 'PhPh')) {
              if (p1.elemType === 'PhPh') { p1.elemType = 'PhPh_Pink'; p1.setupProperties(); }
              else { p2.elemType = 'PhPh_Pink'; p2.setupProperties(); }
              for (let k = 0; k < 15; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 50, 255)', 0.6));
            } else if (isMatch('Acid', 'PhPh_Pink')) {
              if (p1.elemType === 'PhPh_Pink') { p1.elemType = 'PhPh'; p1.setupProperties(); }
              else { p2.elemType = 'PhPh'; p2.setupProperties(); }
              for (let k = 0; k < 15; k++) effects.push(new SparkParticle(cx, cy, 'rgb(240, 240, 240)', 0.6));
            } else if (isMatch('Base', 'Fe_Salt')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Fe_Oxide', 'Salt'], cx, cy));
              for (let k = 0; k < 30; k++) effects.push(new SparkParticle(cx, cy, 'rgb(100, 100, 150)', 0.8));
            } else if (isMatch('H2O2', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['O2', 'H2O'], cx, cy));
              for (let k = 0; k < 45; k++) effects.push(new SparkParticle(cx, cy, 'rgb(100, 200, 255)', 1.4));
            } else if (isMatch('H2O2', 'Fe')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['O2', 'H2O', 'Fe_Oxide'], cx, cy));
              for (let k = 0; k < 40; k++) effects.push(new SparkParticle(cx, cy, 'rgb(120, 220, 255)', 1.2));
            } else if (isMatch('Na', 'H2O') || isMatch('K', 'H2O')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Base', 'H2'], cx, cy));
              for (let k = 0; k < 55; k++) effects.push(new SparkParticle(cx, cy, 'rgb(50, 200, 255)', 1.8));
            } else if (isMatch('Acid', 'Al')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2', 'Al_Salt'], cx, cy));
              for (let k = 0; k < 35; k++) effects.push(new SparkParticle(cx, cy, 'rgb(220, 220, 240)', 1.0));
            } else if (isMatch('Acid', 'Mg')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2', 'Mg_Salt'], cx, cy));
              for (let k = 0; k < 40; k++) effects.push(new SparkParticle(cx, cy, 'rgb(255, 255, 180)', 1.2));
            } else if (isMatch('Acid', 'Fe')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2', 'Fe_Salt'], cx, cy));
              for (let k = 0; k < 25; k++) effects.push(new SparkParticle(cx, cy, 'rgb(255, 240, 200)', 0.8));
            } else if (isMatch('Base', 'Al')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['H2', 'Al_Salt'], cx, cy));
              for (let k = 0; k < 35; k++) effects.push(new SparkParticle(cx, cy, 'rgb(200, 200, 250)', 1.0));
            } else if (isMatch('U', 'Pb')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(new ChemicalParticle(cx, cy, 'Pb_Shielded'));
              for (let k = 0; k < 40; k++) effects.push(new SparkParticle(cx, cy, 'rgb(100, 255, 100)', 0.5));
            } else if (isMatch('U', 'Fire')) {
              toRemove.add(i); toRemove.add(j);
              newParticles.push(...createSplitParticles(['Fire', 'Fire', 'Fire'], cx, cy));
              for (let k = 0; k < 100; k++) effects.push(new SparkParticle(cx, cy, 'rgb(0, 255, 100)', 3.0, 2.2));
            }
          }
        }
      }

      particles = particles.filter((_, idx) => !toRemove.has(idx));
      particles.push(...newParticles);

      particles.forEach(p => p.update(canvas.width, canvas.height, effects));
      effects.forEach(eff => eff.update());
      effects = effects.filter(eff => eff.life > 0);
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.fillStyle = '#232323';
      ctx.fillRect(0, 0, canvas.width, 115);
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 115);
      ctx.lineTo(canvas.width, 115);
      ctx.stroke();

      buttons.forEach(btn => {
        ctx.fillStyle = btn.color;
        ctx.fillRect(btn.x1, btn.y1, btn.x2 - btn.x1, btn.y2 - btn.y1);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(btn.x1, btn.y1, btn.x2 - btn.x1, btn.y2 - btn.y1);

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(btn.label, (btn.x1 + btn.x2) / 2, (btn.y1 + btn.y2) / 2);
      });

      if (challengeState.active) {
        drawChallengeHUD();
      }

      particles.forEach(p => p.draw(ctx));
      effects.forEach(eff => eff.draw(ctx));

      if (showSidebar) drawRecipeSidebar();
      if (showHelp) drawHelpOverlay();

      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText("💡 단축키: [ TAB ] 도감 열기/닫기  |  [ C ] 랜덤 챌린지 시작  |  [ R ] 화면 리셋/재도전  |  [ N ] 다음 랜덤 미션  |  [ H ] 도움말", 20, canvas.height - 18);
      ctx.restore();
    }

    function drawChallengeHUD() {
      const cur = challengeState.currentTarget;
      if (!cur) return;

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(20, 125, 420, 75);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 125, 420, 75);

      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`[ 🎯 랜덤 목표 ]: ${cur.label} 만들기`, 30, 148);

      ctx.fillStyle = challengeState.timeLeft <= 5 ? '#ff3030' : '#00ffff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(`⏱️ 남은 시간: ${challengeState.timeLeft}초`, 30, 180);

      ctx.restore();

      if (challengeState.status === 'SUCCESS') {
        drawModalOverlay("🎉 미션 성공! 🎉", `${cur.label} 합성에 성공했습니다!`, "#32ff64", "▶ [ N ] 키를 눌러 다음 랜덤 미션 진행");
      } else if (challengeState.status === 'FAILED') {
        drawModalOverlay("💥 시간 초과! 실패 💥", "시간 내에 목표 물질을 만들지 못했습니다.", "#ff3030", "▶ [ R ] 키: 재도전  |  [ N ] 키: 다른 랜덤 미션");
      }
    }

    function drawModalOverlay(title, subtitle, color, actionText) {
      ctx.save();
      ctx.fillStyle = 'rgba(10, 10, 15, 0.88)';
      ctx.fillRect(340, 240, 600, 240);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(340, 240, 600, 240);

      ctx.fillStyle = color;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, 640, 300);

      ctx.fillStyle = '#ffffff';
      ctx.font = '16px sans-serif';
      ctx.fillText(subtitle, 640, 350);

      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(actionText, 640, 420);
      ctx.restore();
    }

        { text: "22. CO2 + Base -> Salt + H2O (CO2 흡수)", size: 12, color: '#f0f0f0' },
        { text: "23. Acid + Fe_Oxide -> Fe_Salt + H2O (녹 세척)", size: 12, color: '#f0f0f0' },
        { text: "24. Acid + Cu_Oxide -> Cu_Salt + H2O", size: 12, color: '#f0f0f0' },

        { text: "27. Acid + PhPh_Pink -> PhPh (무색 탈색)", size: 12, color: '#f0f0f0' },
        { text: "28. Base + Fe_Salt -> Fe_Oxide + Salt (침전)", size: 12, color: '#f0f0f0' },
        { text: "--- 4. 기체 발생 및 알칼리 반응 ---", size: 13, color: '#32ff64' },
        { text: "29. H2O2 + Fire -> O2 + H2O (산소 분해)", size: 12, color: '#f0f0f0' },

    function drawHelpOverlay() {
      const boxW = 740, boxH = 440;
      const x1 = (canvas.width - boxW) / 2;
      const y1 = (canvas.height - boxH) / 2;

      ctx.save();
      ctx.fillStyle = 'rgba(20, 20, 25, 0.92)';
      ctx.fillRect(x1, y1, boxW, boxH);
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x1, y1, boxW, boxH);

      const helpTexts = [
        { text: "[ 🧪 핸드 케미스트리 샌드박스 도움말 ]", x: x1 + 30, y: y1 + 40, size: 18, color: '#00ffff' },
        { text: "1. 🖐️ 기본 조작: 엄지-검지 손가락 끝을 맞대어(Pinch) 물질을 집거나 스폰합니다.", x: x1 + 30, y: y1 + 90, size: 13, color: '#f0f0f0' },
        { text: "2. ⚗️ 화학 반응: 서로 다른 반응 물질을 가까이 맞닿게 하면 반응이 일어납니다.", x: x1 + 30, y: y1 + 130, size: 13, color: '#f0f0f0' },
        { text: "3. 🎯 랜덤 챌린지: [ C ] 키나 [🎯 랜덤 챌린지] 버튼을 누르면 도감 물질 중 하나가 지정됩니다.", x: x1 + 30, y: y1 + 170, size: 13, color: '#ffd700' },

        { text: "5. 🧹 화면 리셋: [ R ] 키를 누르면 화면상의 모든 입자가 삭제/초기화됩니다.", x: x1 + 30, y: y1 + 250, size: 13, color: '#f0f0f0' },

        { text: "▶ 시작하려면 [ Space ] 또는 [ H ] 키를 누르세요!", x: x1 + 30, y: y1 + 380, size: 15, color: '#ffd700' }
      ];

      ctx.textAlign = 'left';
      helpTexts.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.font = `${t.size}px sans-serif`;
        ctx.fillText(t.text, t.x, t.y);
      });

      ctx.restore();
    }

    function setupEventListeners() {
      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();

        if (e.key === 'Tab') {
          e.preventDefault();
          showSidebar = !showSidebar;
        } else if (key === 'c') {
          startRandomChallenge();
        } else if (key === 'h') {
          showHelp = !showHelp;
        } else if (e.code === 'Space' && showHelp) {
          e.preventDefault();
          showHelp = false;
        } else if (key === 'r') {
          particles = [];
          effects = [];
          if (challengeState.active) {
            startRandomChallenge();
          }
        } else if (key === 'n') {
          startRandomChallenge();
        } else if (key === '[' || key === '1') {
          sidebarPage = 1;
        } else if (key === ']' || key === '2') {
          sidebarPage = 2;
        }
      });
    }

    window.addEventListener('load', init);
  </script>
